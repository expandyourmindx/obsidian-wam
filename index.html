<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Obsidian WAM — Test Host</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #080b0f;
            color: #8a9298;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 32px;
        }

        h1 {
            color: #b08df0;
            font-size: 32px;
            letter-spacing: 0.2em;
            font-weight: normal;
        }

        .status {
            color: #3a4450;
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .status.ready {
            color: #5ab870;
        }

        .status.error {
            color: #c05050;
        }

        .keys {
            display: flex;
            gap: 4px;
        }

        button.key {
            background: #1e2630;
            border: 1px solid #2e3d4e;
            color: #8a9298;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 20px 16px;
            cursor: pointer;
            min-width: 56px;
            text-align: center;
        }

        button.key:active,
        button.key.held {
            background: #3d2468;
            border-color: #7b4fcf;
            color: #b08df0;
        }

        .note-label {
            font-size: 9px;
            margin-top: 6px;
            display: block;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 360px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .control-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #3a4450;
            min-width: 80px;
        }

        input[type=range] {
            flex: 1;
            accent-color: #7b4fcf;
        }

        .control-value {
            font-size: 10px;
            color: #b08df0;
            min-width: 40px;
            text-align: right;
        }
    </style>
</head>

<body>

    <h1>OBSIDIAN</h1>
    <div class="status" id="status">Initializing...</div>

    <div class="keys" id="keys"></div>

    <div class="controls">
        <div class="control-row">
            <span class="control-label">Attack</span>
            <input type="range" id="attack" min="0.001" max="2" step="0.001" value="0.01">
            <span class="control-value" id="attack-val">0.01s</span>
        </div>
        <div class="control-row">
            <span class="control-label">Decay</span>
            <input type="range" id="decay" min="0.001" max="2" step="0.001" value="0.1">
            <span class="control-value" id="decay-val">0.1s</span>
        </div>
        <div class="control-row">
            <span class="control-label">Sustain</span>
            <input type="range" id="sustain" min="0" max="1" step="0.01" value="0.7">
            <span class="control-value" id="sustain-val">0.70</span>
        </div>
        <div class="control-row">
            <span class="control-label">Release</span>
            <input type="range" id="release" min="0.001" max="4" step="0.001" value="0.3">
            <span class="control-value" id="release-val">0.3s</span>
        </div>
        <div class="control-row">
            <span class="control-label">Volume</span>
            <input type="range" id="gain" min="0" max="1" step="0.01" value="0.5">
            <span class="control-value" id="gain-val">0.50</span>
        </div>
        <div class="control-row">
            <span class="control-label">Cutoff</span>
            <input type="range" id="cutoff" min="0.01" max="1" step="0.001" value="0.8">
            <span class="control-value" id="cutoff-val">0.80</span>
        </div>
        <div class="control-row">
            <span class="control-label">Resonance</span>
            <input type="range" id="resonance" min="0" max="3.8" step="0.01" value="0.1">
            <span class="control-value" id="resonance-val">0.10</span>
        </div>
        <div class="control-row">
            <span class="control-label">Waveform</span>
            <select id="waveform"
                style="flex:1; background:#1e2630; border:1px solid #2e3d4e; color:#8a9298; font-family:'Courier New',monospace; font-size:11px; padding:4px 8px;">
                <option value="sine">Sine</option>
                <option value="saw">Sawtooth</option>
                <option value="square">Square</option>
                <option value="triangle">Triangle</option>
            </select>
        </div>
    </div>

    <script type="module">
        import ObsidianWAM from './src/index.js';

        const status = document.getElementById('status');

        // One octave of notes for the test keyboard
        const notes = [
            { label: 'C4', midi: 60 },
            { label: 'D4', midi: 62 },
            { label: 'E4', midi: 64 },
            { label: 'F4', midi: 65 },
            { label: 'G4', midi: 67 },
            { label: 'A4', midi: 69 },
            { label: 'B4', midi: 71 },
            { label: 'C5', midi: 72 },
        ];

        // Build keyboard buttons
        const keysEl = document.getElementById('keys');
        notes.forEach(({ label, midi }) => {
            const btn = document.createElement('button');
            btn.className = 'key';
            btn.innerHTML = `${label}<span class="note-label">${midi}</span>`;

            btn.addEventListener('mousedown', () => {
                btn.classList.add('held');
                obsidian?.noteOn(midi, 100);
            });

            btn.addEventListener('mouseup', () => {
                btn.classList.remove('held');
                obsidian?.noteOff(midi);
            });

            btn.addEventListener('mouseleave', () => {
                if (btn.classList.contains('held')) {
                    btn.classList.remove('held');
                    obsidian?.noteOff(midi);
                }
            });

            keysEl.appendChild(btn);
        });

        // Wire up sliders
        function wireSlider(id, paramKey, suffix = '') {
            const slider = document.getElementById(id);
            const valEl = document.getElementById(`${id}-val`);
            slider.addEventListener('input', () => {
                const v = parseFloat(slider.value);
                valEl.textContent = v.toFixed(2) + suffix;
                obsidian?.setParam(paramKey, v);
            });
        }

        wireSlider('attack', 'attack', 's');
        wireSlider('decay', 'decay', 's');
        wireSlider('sustain', 'sustain', '');
        wireSlider('release', 'release', 's');
        wireSlider('gain', 'masterGain', '');
        wireSlider('cutoff', 'filterCutoff', '');
        wireSlider('resonance', 'filterResonance', '');

        document.getElementById('waveform').addEventListener('change', (e) => {
            obsidian?.setParam('osc1Waveform', e.target.value);
        });

        // Keyboard mapping — two rows give you a chromatic octave
        const keyMap = {
            'a': 60, // C4
            'w': 61, // C#4
            's': 62, // D4
            'e': 63, // D#4
            'd': 64, // E4
            'f': 65, // F4
            't': 66, // F#4
            'g': 67, // G4
            'y': 68, // G#4
            'h': 69, // A4
            'u': 70, // A#4
            'j': 71, // B4
            'k': 72, // C5
            'o': 73, // C#5
            'l': 74, // D5
            'p': 75, // D#5
        };

        const heldKeys = new Set();

        // Kill all notes when window loses focus
        // Prevents stuck notes when tabbing away or triggering shortcuts
        window.addEventListener('blur', () => {
            heldKeys.forEach(note => obsidian?.noteOff(note));
            heldKeys.clear();
        });

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return; // ignore held key repeat
            if (e.metaKey || e.ctrlKey) return;
            const note = keyMap[e.key];
            if (note === undefined) return;
            if (heldKeys.has(note)) return;
            e.preventDefault();
            obsidian?.noteOff(note);
            heldKeys.add(note);
            boot().then(() => obsidian?.noteOn(note, 100));
        });

        window.addEventListener('keyup', (e) => {
            const note = keyMap[e.key];
            if (note === undefined) return;
            heldKeys.delete(note);
            obsidian?.noteOff(note);
        });

        // Boot the WAM
        // AudioContext must be created after a user gesture on some browsers
        // so we init on first interaction
        let obsidian = null;
        let booted = false;

        async function boot() {
            if (booted) return;
            booted = true;

            try {
                const audioContext = new AudioContext();
                await audioContext.resume();

                const groupId = 'obsidian-test-host';
                obsidian = new ObsidianWAM(groupId, audioContext);
                const audioNode = await obsidian.createAudioNode();

                // Connect directly to speakers
                audioNode.connect(audioContext.destination);

                status.textContent = 'Ready';
                status.className = 'status ready';
            } catch (err) {
                console.error(err);
                status.textContent = `Error: ${err.message}`;
                status.className = 'status error';
            }
        }

        document.addEventListener('click', boot, { once: true });
        status.textContent = 'Click anywhere to initialize audio';
    </script>

</body>

</html>
